  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Pixel-Mosaic Dissolve Between Lines
    const lineTransitions = [[4.98, 5.12], [7.28, 7.46], [9.65, 9.8], [11.96, 12.08], [13.96, 14.08], [16.82, 16.92], [18.75, 19.3]];
    const tiles = document.querySelectorAll(".mosaic-tile");
    
    lineTransitions.forEach(([tStart, tEnd], idx) => {
      const dur = tEnd - tStart;
      const halfDur = dur * 0.45;
      
      tl.fromTo(".mosaic-wrap", 
        { opacity: 0 }, 
        { opacity: 0.88, duration: halfDur, ease: "power1.in" }, 
        tStart
      );
      tl.to(".mosaic-wrap", 
        { opacity: 0, duration: dur - halfDur, ease: "power2.out" }, 
        tStart + halfDur
      );

      tiles.forEach((tile, tIdx) => {
        const pseudoRand = ((Math.sin(tIdx * 89.7 + idx * 43.3) + 1) / 2);
        if (pseudoRand > 0.28) {
          const tileOpacity = 0.35 + (pseudoRand * 0.65);
          tl.fromTo(tile,
            { opacity: 0, scale: 0.82 },
            { opacity: tileOpacity, scale: 1.0, duration: halfDur, ease: "none" },
            tStart
          );
          tl.to(tile,
            { opacity: 0, scale: 1.12, duration: dur - halfDur, ease: "none" },
            tStart + halfDur
          );
        }
      });
    });

    // 2. White Flash Frames on Strong Beats
    const beatTimes = [0.12, 0.92, 1.78, 2.64, 3.58, 4.58, 5.14, 6.1, 7.42, 8.18, 9.72, 10.74, 11.62, 12.02, 12.96, 14.02, 15.0, 16.22, 17.04, 17.72, 18.78];
    beatTimes.forEach((bt) => {
      if (bt < 19.3) {
        tl.fromTo(".flash-box", 
          { opacity: 0.72 }, 
          { opacity: 0, duration: 0.08, ease: "power2.out" }, 
          bt
        );
      }
    });

    // 3. Film Grain Stepped Jitter (Deterministic)
    for (let t = 0; t < 19.5; t += 0.08) {
      const gx = ((Math.sin(t * 137.5) * 1000) % 24) - 12;
      const gy = ((Math.cos(t * 269.3) * 1000) % 24) - 12;
      tl.set(".grain-layer", { x: gx, y: gy }, Number(t.toFixed(2)));
    }

    tl.seek(0);
    window.__timelines = window.__timelines || {};
    window.__timelines["overlays"] = tl;
  </script>
